# Construit et teste la version Mac sur un vrai Mac (puce Apple), puis joint GTA-Stream-Clipper-Mac.dmg à la
# release GitHub. L'installeur Windows, lui, se construit sur un PC Windows (python build_exe.py).
#   - automatiquement quand une release est publiée ;
#   - à la main (Actions > Version Mac > Run workflow) : avec un tag, le .dmg est joint à cette release ;
#     sans tag, il est seulement construit, testé et gardé avec le compte rendu du test.
name: Version Mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release où joindre GTA-Stream-Clipper-Mac.dmg (vide = construire et tester seulement)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python a bien Tk (la fenêtre de l'application)
        run: python -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Application + image disque
        run: python build_exe.py

      - name: Test sur le Mac (double-clic, interface, un vrai clip viral, éditeur, Quitter, image disque)
        run: python packaging/smoke_test_mac.py

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-Stream-Clipper-Mac
          path: dist/GTA-Stream-Clipper-Mac.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-mac
          path: build/smoke/

      - name: Joindre à la release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" dist/GTA-Stream-Clipper-Mac.dmg --clobber
